[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zcore"
version = "0.1.0"
description = "Zero-Shot Coreset Selection (ZCore)"
readme = "README.md"
requires-python = ">=3.8"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]
