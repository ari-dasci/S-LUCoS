[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lucos"
version = "0.1.0"
description = "Latent Unsupervised Context Selection for Tabular Foundation Models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Oroel Ipas" },
  { name = "Guillermo Gomez-Trenado" },
  { name = "Rocio Romero-Zaliz" },
  { name = "Isaac Triguero" },
]
keywords = [
  "active learning",
  "context selection",
  "tabular foundation models",
  "tabular data",
  "unsupervised learning",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "numpy>=1.24,<2",
  "pandas>=2.0.0,<3",
  "scipy>=1.9.0",
  "scikit-learn>=1.0.0",
  "xgboost>=1.7.0",
  "omegaconf>=2.1.0",
  "openml>=0.10.0",
  "openpyxl>=3.0.0",
  "tqdm>=4.60.0",
  "torch>=2.0.0",
  "einops>=0.7.0",
  "tabicl>=2.1.1",
  "tabpfn>=7.0.0",
  "scikit-learn-extra>=0.3.0",
  "nvidia-ml-py>=13.0.0",
  "psutil>=5.9.0",
  "matplotlib>=3.5.0",
  "scikit-posthocs>=0.12.0",
  "wandb>=0.15.0",
  "torchmetrics>=1.0.0",
  "transformers>=4.30.0",
]

[project.urls]
Paper = "https://arxiv.org/abs/2605.27254"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"lucos.SSMA" = ["*.yaml", "README.md"]
"lucos.unsupervised_context_selection" = ["README.MD", "config/*.yaml"]
"lucos.unsupervised_context_selection.agg_results_and_plot" = ["README.md"]
"lucos.utils" = ["README.md"]
